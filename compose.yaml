services:
  db:
    image: postgres:latest
    container_name: socialboo-db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: socialboo
      POSTGRES_PASSWORD: socialboo
      POSTGRES_DB: socialboo

  pgadmin:
    image: dpage/pgadmin4
    container_name: socialboo-pgadmin
    restart: unless-stopped
    ports:
      - "5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@socialboo.com
      PGADMIN_DEFAULT_PASSWORD: socialboo
    depends_on:
      - db